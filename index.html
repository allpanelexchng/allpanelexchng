<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming Platform</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

       <!--  <img
            src="WhatsApplogo.jpeg"
            alt="Logo"
            class="logo"
        > -->

        <h1>
            India’s No 1, Oldest and Trusted Gaming Platform
        </h1>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main-content">

        <div class="login-image-wrapper">

            <!-- Login Image -->

            <img
                src="WhatsAppImage.jpeg"
                alt="Login"
                class="login-image"
            >


            <!-- Buttons inside image -->

            <div class="whatsapp-buttons">

                <button
                  class="whatsapp-button"
                        onclick="openWhatsApp(event)"
                    >
                    <i class="fa-brands fa-whatsapp"></i>
                    WhatsApp
                </button>

                <button
                   class="whatsapp-button"
                    onclick="openWhatsApp(event)"
                    >
                    Get More Info
                </button>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-links">

            <a href="#" onclick="openWhatsApp(event)">
                Terms and Conditions
            </a>

            <a href="#" onclick="openWhatsApp(event)">
                Responsible Gaming
            </a>

        </div>

        <div class="support">
            24x7 Customer Support
        </div>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
